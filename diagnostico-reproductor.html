<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDF · Diagnóstico reproductor iPhone</title><style>body{background:#081625;color:#fff;font:16px system-ui;margin:20px}video{width:100%;background:black}button,input{font:inherit;margin:12px 0;padding:10px}pre{white-space:pre-wrap;background:#17314a;padding:12px;border-radius:8px}</style></head><body><h2>GDF · Prueba del reproductor</h2><p>Esta prueba no activa inteligencia artificial ni modifica el detector original.</p><input id="file" type="file" accept="video/*"><video id="v" controls playsinline preload="auto"></video><p><button id="play">Reproducir video</button></p><p id="state">Selecciona un video.</p><pre id="log"></pre><script>const v=document.querySelector('#v'),f=document.querySelector('#file'),s=document.querySelector('#state'),l=document.querySelector('#log');let url;function log(t){const m=new Date().toLocaleTimeString()+' · '+t;l.textContent=(m+'\n'+l.textContent).slice(0,5000);s.textContent=t}f.onchange=()=>{if(url)URL.revokeObjectURL(url);const x=f.files[0];if(!x)return;v.pause();v.removeAttribute('src');v.load();url=URL.createObjectURL(x);v.src=url;v.load();log('Archivo: '+x.name+' · '+x.type+' · '+Math.round(x.size/1024/1024)+' MB')};for(const e of ['loadedmetadata','loadeddata','canplay','playing','pause','waiting','stalled','suspend','abort','ended','error'])v.addEventListener(e,()=>log(e+' · tiempo '+v.currentTime.toFixed(2)+' s · readyState '+v.readyState+' · networkState '+v.networkState+(v.error?' · error '+v.error.code:'')));document.querySelector('#play').onclick=async()=>{try{await v.play();log('play() aceptado')}catch(e){log('play() rechazado: '+e.name+' '+e.message)}};setInterval(()=>{if(v.src&&v.paused&&v.currentTime>0&&v.currentTime<v.duration) s.textContent='Video pausado en '+v.currentTime.toFixed(2)+' s. Revisa el registro.'},1500);</script></body></html>
