<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDF Video Intelligence</title><style>:root{font-family:system-ui;color:#e9f2ff;background:#081625}body{margin:0}header{padding:18px;background:#102b46}h1{font-size:22px;color:#eacb7d}nav{display:flex;overflow-x:auto;gap:8px;padding:12px}button{background:#173b5b;color:white;border:1px solid #41627a;border-radius:9px;padding:12px;white-space:nowrap}button.active{background:#b58c3b;color:#081625}main{padding:15px;max-width:950px;margin:auto}.panel,.tile{background:#112b44;border:1px solid #2c4c66;border-radius:12px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}video{width:100%;max-height:360px;background:#000}small{color:#b9cadd}</style></head><body><header><h1>GUERREROS DE FE · VIDEO INTELLIGENCE</h1><small>Versión de pruebas · Detección IA todavía no conectada</small></header><nav id="nav"></nav><main><section class="panel"><h3>Reproductor único</h3><input type="file" accept="video/*" id="file"><p><button id="start">Detección automática + IA</button> <button id="stop">Detener</button></p><p id="status">Sin video · Motor de IA no conectado</p><video id="video" controls playsinline></video></section><section id="screen"></section></main><script>const names=["Inicio","Partido en vivo","Cuadro de mando","Videoanálisis","Análisis táctico","Jugador 360°","Dirección Técnica","Scouting","Configuración"];const sections=[["Operaciones","Estado de cámaras","Últimas sesiones","Alertas"],["Consola multicámara","Cámara 1","Cámara 2","Cámara 3","Cámara 4","Marcador","Cronómetro"],["Posesión","Tiros","Recuperaciones","Pérdidas","Dominio por zonas"],["Biblioteca de eventos","Línea temporal","Crear clip","Exportar selección"],["Mapa de calor","Posiciones","Pases","Transiciones","Comparar períodos"],["Seleccionar jugador","Recorridos","Velocidad","Duelos"],["AI Technical Director Pro","Diagnóstico táctico","Simulador de cambios","Análisis del rival","Briefing con voz"],["Evaluación de talentos","Posición","Comparación","Seguimiento"],["Fuentes de video","Calibración","Motor IA","Almacenamiento"]];function show(i){document.getElementById("nav").innerHTML=names.map((n,j)=>'<button class="'+(i===j?'active':'')+'" onclick="show('+j+')">'+n+'</button>').join("");document.getElementById("screen").innerHTML='<h2>'+names[i]+'</h2><div class="grid">'+sections[i].map(t=>'<div class="tile"><strong>'+t+'</strong><p><small>Sin datos procesados</small></p></div>').join("")+'</div>'}document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(f){document.getElementById("video").src=URL.createObjectURL(f);document.getElementById("status").textContent="Video cargado · IA no conectada"}};document.getElementById("start").onclick=()=>document.getElementById("status").textContent="No se puede iniciar detección: servidor RF-DETR no conectado";document.getElementById("stop").onclick=()=>{document.getElementById("video").pause();document.getElementById("status").textContent="Reproducción detenida"};show(0);</script></body></html>
