<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDF · Diagnóstico de audio v3</title><style>body{background:#081625;color:#eef5ff;font:16px system-ui;margin:16px}video{display:block;width:100%;background:#000;max-height:55vh}button,input{font:inherit;padding:12px;margin:6px 3px}button{background:#d3ad5c;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17314a;padding:12px;font-size:12px}</style></head><body><h2>GDF · Reproductor v3 (prueba de audio)</h2><p>Play, Pausa y Sonido independientes. No modifica el detector IA.</p><input id="file" type="file" accept="video/*"><video id="video" playsinline webkit-playsinline controls preload="metadata"></video><p><button id="play">▶ Play</button><button id="pause">⏸ Pausa</button><button id="mute">🔇 Silenciar</button><button id="sound">🔊 Activar sonido</button></p><p id="state">Selecciona un archivo.</p><pre id="log"></pre><script>const v=document.getElementById('video'),f=document.getElementById('file'),s=document.getElementById('state'),l=document.getElementById('log');let url=null;function log(msg){let t=new Date().toLocaleTimeString()+' · '+msg;l.textContent=(t+'\n'+l.textContent).slice(0,9000);s.textContent=msg}f.addEventListener('change',()=>{if(url)URL.revokeObjectURL(url);v.pause();v.removeAttribute('src');v.load();const file=f.files[0];if(!file)return;url=URL.createObjectURL(file);v.src=url;v.muted=true;v.load();log('Archivo: '+file.name+' ('+file.type+')')});async function play(){try{await v.play();log('Play aceptado')}catch(e){log('Play rechazado: '+e.name+' '+e.message)}}document.getElementById('play').onclick=play;document.getElementById('pause').onclick=()=>{v.pause();log('Pausa solicitada')};document.getElementById('mute').onclick=()=>{v.muted=true;log('Silenciado; paused='+v.paused)};document.getElementById('sound').onclick=()=>{v.muted=false;log('Audio activado; paused='+v.paused+'; ready='+v.readyState)};for(const e of ['loadstart','loadedmetadata','canplay','play','playing','pause','waiting','stalled','suspend','seeking','seeked','ended','error','volumechange'])v.addEventListener(e,()=>log(e+' · t='+v.currentTime.toFixed(2)+' · paused='+v.paused+' · muted='+v.muted+' · ready='+v.readyState+(v.error?' · error='+v.error.code:'')));document.addEventListener('visibilitychange',()=>log('visibility='+document.visibilityState));</script></body></html>
