<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDF Audio V4</title><style>body{font:16px system-ui;background:#081625;color:white;margin:16px}video{width:100%;max-height:50vh;background:black}button,input{padding:12px;margin:5px;font:inherit}button{background:#d3ad5c;border:0;border-radius:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17314a;padding:12px;font-size:12px}</style><h2>GDF · Diagnóstico de audio V4</h2><p>Prueba aislada, sin modificar el detector.</p><input type="file" id="file" accept="video/*"><video id="v" playsinline controls preload="metadata"></video><p><button id="play">Play</button><button id="pause">Pausa</button><button id="audio">Activar audio y reanudar</button><button id="mute">Silenciar</button></p><p id="status">Selecciona video</p><pre id="log"></pre><script>const v=document.querySelector('#v'),file=document.querySelector('#file'),status=document.querySelector('#status'),logbox=document.querySelector('#log');let url;function log(x){const m=new Date().toLocaleTimeString()+' '+x;status.textContent=m;logbox.textContent=(m+'\n'+logbox.textContent).slice(0,9000)}file.onchange=()=>{v.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file.files[0]);v.src=url;v.muted=true;v.load();log('Cargado '+file.files[0].name)};async function start(){try{await v.play();log('play aceptado')}catch(e){log('play rechazado '+e.name+' '+e.message)}}document.querySelector('#play').onclick=start;document.querySelector('#pause').onclick=()=>v.pause();document.querySelector('#mute').onclick=()=>{v.muted=true;log('silenciado')};document.querySelector('#audio').onclick=async()=>{v.muted=false;log('audio activado, intentando reproducir');await start();setTimeout(()=>log('comprobación 1s: paused='+v.paused+' time='+v.currentTime.toFixed(2)+' ready='+v.readyState),1000)};for(const e of ['play','playing','pause','waiting','stalled','canplay','error','volumechange','loadedmetadata'])v.addEventListener(e,()=>log(e+' t='+v.currentTime.toFixed(2)+' muted='+v.muted+' paused='+v.paused+(v.error?' error='+v.error.code:'')));</script></html>
