<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDF Audio V5 diagnóstico</title><style>body{font:16px system-ui;background:#081625;color:white;margin:16px}video{width:100%;max-height:45vh;background:black}button,input{padding:12px;margin:5px;font:inherit}button{background:#d3ad5c;border:0;border-radius:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17314a;padding:12px;font-size:12px}</style><h2>GDF · Audio V5</h2><p>Diagnóstico de audio en iPhone. No modifica la IA.</p><input type="file" id="file" accept="video/*"><video id="v" playsinline controls preload="metadata"></video><p><button id="muted">Reproducir silenciado</button><button id="audible">Reproducir con audio desde el inicio</button><button id="enable">Activar sonido sin cambiar Play</button><button id="mute">Silenciar</button><button id="pause">Pausa</button></p><p id="status">Selecciona un video</p><button id="copy">Copiar registro</button><pre id="log"></pre><script>const v=document.querySelector('#v'),f=document.querySelector('#file'),s=document.querySelector('#status'),box=document.querySelector('#log');let url,last=0;function log(x){const m=new Date().toLocaleTimeString()+' '+x;s.textContent=m;box.textContent=(m+'\n'+box.textContent).slice(0,12000)}f.onchange=()=>{if(!f.files[0])return;v.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f.files[0]);v.src=url;v.muted=true;v.load();log('Archivo cargado '+f.files[0].name)};async function play(muted){v.muted=muted;try{await v.play();log('play aceptado muted='+muted)}catch(e){log('play rechazado '+e.name+' '+e.message)}}document.querySelector('#muted').onclick=()=>play(true);document.querySelector('#audible').onclick=()=>play(false);document.querySelector('#enable').onclick=()=>{v.muted=false;log('audio activado sin play()')};document.querySelector('#mute').onclick=()=>{v.muted=true;log('silenciado sin play()')};document.querySelector('#pause').onclick=()=>v.pause();document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(box.textContent);log('registro copiado')}catch(e){log('no se pudo copiar: '+e.message)}};for(const e of ['play','playing','pause','waiting','stalled','canplay','error','volumechange','loadedmetadata','suspend','emptied','abort'])v.addEventListener(e,()=>log(e+' t='+v.currentTime.toFixed(2)+' muted='+v.muted+' paused='+v.paused+' ready='+v.readyState+(v.error?' error='+v.error.code:'')));setInterval(()=>{if(!v.paused&&v.readyState>0){if(v.currentTime===last)log('alerta: tiempo no avanza');last=v.currentTime}},2500);</script></html>
