<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDF · Reproductor experimental v2</title><style>body{background:#081625;color:#eef5ff;font:16px system-ui;margin:16px}video{display:block;width:100%;background:black;max-height:55vh}button,input{font:inherit;padding:12px;margin:7px 4px 7px 0}button{background:#d3ad5c;border:0;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#17314a;padding:12px;border-radius:8px;font-size:13px}</style></head><body><h2>GDF · Reproductor experimental v2</h2><p>Prueba independiente. No activa IA ni modifica el sistema original.</p><input id="file" type="file" accept="video/*"><video id="video" controls playsinline webkit-playsinline preload="auto"></video><p><button id="play">Reproducir</button><button id="mute">Silenciar y reproducir</button><button id="sound">Activar sonido</button><button id="full">Pantalla completa</button></p><p id="state">Selecciona un video.</p><pre id="log"></pre><script>const v=document.getElementById('video'),f=document.getElementById('file'),s=document.getElementById('state'),l=document.getElementById('log');let u;function log(t){let x=new Date().toLocaleTimeString()+' · '+t;l.textContent=(x+'\n'+l.textContent).slice(0,7000);s.textContent=t}f.onchange=()=>{if(u)URL.revokeObjectURL(u);v.pause();v.removeAttribute('src');v.load();let x=f.files[0];if(!x)return;u=URL.createObjectURL(x);v.src=u;v.load();log('Archivo '+x.name+' · '+x.type+' · '+Math.round(x.size/1048576)+' MB')};for(let e of ['loadstart','loadedmetadata','loadeddata','canplay','playing','pause','waiting','stalled','suspend','seeking','seeked','ended','error','emptied','volumechange'])v.addEventListener(e,()=>log(e+' · t='+v.currentTime.toFixed(2)+' · ready='+v.readyState+' · network='+v.networkState+(v.error?' · mediaError='+v.error.code:'')));async function play(){try{await v.play();log('play() aceptado')}catch(e){log('play() rechazado '+e.name+': '+e.message)}}document.getElementById('play').onclick=play;document.getElementById('mute').onclick=()=>{v.muted=true;play()};document.getElementById('sound').onclick=()=>{v.muted=false;v.volume=1;log('Sonido activado; muted='+v.muted);};document.getElementById('full').onclick=()=>{if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else if(v.requestFullscreen)v.requestFullscreen()};document.addEventListener('visibilitychange',()=>log('visibility='+document.visibilityState));window.addEventListener('pagehide',()=>log('pagehide'));setInterval(()=>{if(v.src&&v.paused&&v.currentTime<v.duration)s.textContent='Pausado en '+v.currentTime.toFixed(2)+' s. Prueba Silenciar y reproducir.'},1500)</script></body></html>
